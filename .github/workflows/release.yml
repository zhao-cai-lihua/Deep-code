name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$packageVersion"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $packageVersion"
          }

      - name: Build installer and portable app
        run: pnpm exec electron-builder --win nsis portable --publish never

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.exe dist/SHA256SUMS.txt --title "Deep code ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" "${release_flags[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.exe dist/SHA256SUMS.txt --title "Deep code ${GITHUB_REF_NAME}" --generate-notes "${release_flags[@]}"
          fi
